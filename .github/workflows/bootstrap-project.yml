name: Build 3D MobiBrainNet Project

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build repository
        shell: bash
        run: |
          set -e

          mkdir -p src
          mkdir -p configs
          mkdir -p notebooks
          mkdir -p assets
          mkdir -p models
          mkdir -p outputs
          mkdir -p tests

          # =========================================================
          # MOVE ORIGINAL NOTEBOOK
          # =========================================================

          if [ -f "alzeimer-classification-multi-model-final.ipynb" ]; then
            mv "alzeimer-classification-multi-model-final.ipynb" \
              "notebooks/alzheimer_multimodel_experiment.ipynb"
          fi

          # =========================================================
          # src/__init__.py
          # =========================================================

          cat > src/__init__.py <<'PYEOF'
          """
          3D MobiBrainNet Alzheimer's Classification.

          Research-oriented volumetric MRI classification framework.
          """

          __version__ = "1.0.0"
          PYEOF

          # =========================================================
          # src/config.py
          # =========================================================

          cat > src/config.py <<'PYEOF'
          from pathlib import Path

          ROOT_DIR = Path(__file__).resolve().parent.parent

          DATA_DIR = ROOT_DIR / "dataset"
          MODEL_DIR = ROOT_DIR / "models"
          OUTPUT_DIR = ROOT_DIR / "outputs"

          CLASS_NAMES = [
              "AD",
              "MCI",
              "CN",
          ]

          VOLUME_SIZE = (
              96,
              96,
              96,
          )

          NUM_CLASSES = len(CLASS_NAMES)

          BATCH_SIZE = 2

          LEARNING_RATE = 1e-4

          WEIGHT_DECAY = 1e-4

          EPOCHS = 30

          RANDOM_SEED = 42
          PYEOF

          # =========================================================
          # src/data.py
          # =========================================================

          cat > src/data.py <<'PYEOF'
          """
          3D MRI dataset utilities.

          Supported formats:
          - .npy
          - .nii
          - .nii.gz
          """

          from pathlib import Path

          import nibabel as nib
          import numpy as np
          import torch
          import torch.nn.functional as F

          from torch.utils.data import Dataset


          def load_volume(path):
              path = Path(path)

              lower_name = path.name.lower()

              if lower_name.endswith(".npy"):
                  volume = np.load(path)

              elif (
                  lower_name.endswith(".nii")
                  or lower_name.endswith(".nii.gz")
              ):
                  volume = nib.load(
                      str(path)
                  ).get_fdata()

              else:
                  raise ValueError(
                      f"Unsupported volume: {path}"
                  )

              volume = np.asarray(
                  volume,
                  dtype=np.float32,
              )

              volume = np.nan_to_num(
                  volume,
                  nan=0.0,
                  posinf=0.0,
                  neginf=0.0,
              )

              return volume


          def normalize_volume(volume):
              mean = float(volume.mean())

              std = float(volume.std())

              if std < 1e-6:
                  std = 1.0

              return (
                  volume - mean
              ) / std


          def resize_volume(
              volume,
              output_size,
          ):
              tensor = torch.from_numpy(
                  volume
              ).float()

              if tensor.ndim != 3:
                  raise ValueError(
                      "MRI volume must be 3-dimensional."
                  )

              tensor = tensor.unsqueeze(0).unsqueeze(0)

              tensor = F.interpolate(
                  tensor,
                  size=output_size,
                  mode="trilinear",
                  align_corners=False,
              )

              return tensor.squeeze(0)


          def discover_dataset(
              root,
              class_names,
          ):
              root = Path(root)

              samples = []

              for label, class_name in enumerate(
                  class_names
              ):
                  class_dir = root / class_name

                  if not class_dir.exists():
                      continue

                  files = []

                  files.extend(
                      class_dir.rglob("*.npy")
                  )

                  files.extend(
                      class_dir.rglob("*.nii")
                  )

                  files.extend(
                      class_dir.rglob("*.nii.gz")
                  )

                  for path in sorted(set(files)):
                      samples.append(
                          (
                              str(path),
                              label,
                          )
                      )

              if not samples:
                  raise RuntimeError(
                      f"No supported MRI volumes found in {root}"
                  )

              return samples


          class MRIVolumeDataset(Dataset):

              def __init__(
                  self,
                  samples,
                  volume_size=(96, 96, 96),
                  augment=False,
              ):
                  self.samples = samples
                  self.volume_size = volume_size
                  self.augment = augment


              def __len__(self):
                  return len(self.samples)


              def _augment(self, x):

                  if torch.rand(1).item() < 0.5:
                      x = torch.flip(
                          x,
                          dims=[1],
                      )

                  if torch.rand(1).item() < 0.5:
                      x = torch.flip(
                          x,
                          dims=[2],
                      )

                  return x


              def __getitem__(self, index):
                  path, label = self.samples[index]

                  volume = load_volume(path)

                  volume = normalize_volume(
                      volume
                  )

                  volume = resize_volume(
                      volume,
                      self.volume_size,
                  )

                  if self.augment:
                      volume = self._augment(
                          volume
                      )

                  return {
                      "image": volume,
                      "label": torch.tensor(
                          label,
                          dtype=torch.long,
                      ),
                      "path": path,
                  }
          PYEOF

          # =========================================================
          # src/models.py
          # =========================================================

          cat > src/models.py <<'PYEOF'
          """
          3D neural-network architectures.

          Models
          -------
          MobiBrainNet3D
          BaselineCNN3D
          ResNet3D
          """

          import torch
          import torch.nn as nn


          class ConvBNAct(nn.Sequential):

              def __init__(
                  self,
                  in_channels,
                  out_channels,
                  kernel_size=3,
                  stride=1,
                  groups=1,
              ):
                  padding = kernel_size // 2

                  super().__init__(
                      nn.Conv3d(
                          in_channels,
                          out_channels,
                          kernel_size,
                          stride=stride,
                          padding=padding,
                          groups=groups,
                          bias=False,
                      ),
                      nn.BatchNorm3d(
                          out_channels
                      ),
                      nn.ReLU(
                          inplace=True
                      ),
                  )


          class Mobile3DBlock(nn.Module):

              def __init__(
                  self,
                  in_channels,
                  out_channels,
                  stride=1,
              ):
                  super().__init__()

                  self.depthwise = ConvBNAct(
                      in_channels,
                      in_channels,
                      kernel_size=3,
                      stride=stride,
                      groups=in_channels,
                  )

                  self.pointwise = ConvBNAct(
                      in_channels,
                      out_channels,
                      kernel_size=1,
                  )


              def forward(self, x):
                  x = self.depthwise(x)
                  return self.pointwise(x)


          class MobiBrainNet3D(nn.Module):

              def __init__(
                  self,
                  num_classes=3,
                  dropout=0.30,
              ):
                  super().__init__()

                  self.features = nn.Sequential(

                      ConvBNAct(
                          1,
                          16,
                          stride=2,
                      ),

                      Mobile3DBlock(
                          16,
                          32,
                          stride=1,
                      ),

                      Mobile3DBlock(
                          32,
                          64,
                          stride=2,
                      ),

                      Mobile3DBlock(
                          64,
                          96,
                          stride=2,
                      ),

                      Mobile3DBlock(
                          96,
                          160,
                          stride=2,
                      ),

                      Mobile3DBlock(
                          160,
                          256,
                          stride=2,
                      ),
                  )

                  self.pool = nn.AdaptiveAvgPool3d(
                      1
                  )

                  self.classifier = nn.Sequential(
                      nn.Flatten(),
                      nn.Dropout(dropout),
                      nn.Linear(
                          256,
                          num_classes,
                      ),
                  )


              def forward(self, x):
                  x = self.features(x)
                  x = self.pool(x)
                  return self.classifier(x)


          class BaselineCNN3D(nn.Module):

              def __init__(
                  self,
                  num_classes=3,
              ):
                  super().__init__()

                  self.features = nn.Sequential(

                      ConvBNAct(
                          1,
                          32,
                      ),

                      nn.MaxPool3d(2),

                      ConvBNAct(
                          32,
                          64,
                      ),

                      nn.MaxPool3d(2),

                      ConvBNAct(
                          64,
                          128,
                      ),

                      nn.MaxPool3d(2),

                      ConvBNAct(
                          128,
                          256,
                      ),
                  )

                  self.pool = nn.AdaptiveAvgPool3d(
                      1
                  )

                  self.classifier = nn.Sequential(
                      nn.Flatten(),
                      nn.Dropout(0.30),
                      nn.Linear(
                          256,
                          num_classes,
                      ),
                  )


              def forward(self, x):
                  x = self.features(x)
                  x = self.pool(x)
                  return self.classifier(x)


          class Residual3DBlock(nn.Module):

              def __init__(
                  self,
                  in_channels,
                  out_channels,
                  stride=1,
              ):
                  super().__init__()

                  self.conv1 = ConvBNAct(
                      in_channels,
                      out_channels,
                      stride=stride,
                  )

                  self.conv2 = nn.Sequential(
                      nn.Conv3d(
                          out_channels,
                          out_channels,
                          3,
                          padding=1,
                          bias=False,
                      ),
                      nn.BatchNorm3d(
                          out_channels
                      ),
                  )

                  if (
                      stride != 1
                      or in_channels != out_channels
                  ):
                      self.skip = nn.Sequential(
                          nn.Conv3d(
                              in_channels,
                              out_channels,
                              1,
                              stride=stride,
                              bias=False,
                          ),
                          nn.BatchNorm3d(
                              out_channels
                          ),
                      )

                  else:
                      self.skip = nn.Identity()

                  self.relu = nn.ReLU(
                      inplace=True
                  )


              def forward(self, x):
                  identity = self.skip(x)

                  x = self.conv1(x)

                  x = self.conv2(x)

                  x = x + identity

                  return self.relu(x)


          class ResNet3D(nn.Module):

              def __init__(
                  self,
                  num_classes=3,
              ):
                  super().__init__()

                  self.stem = ConvBNAct(
                      1,
                      32,
                      kernel_size=7,
                      stride=2,
                  )

                  self.layers = nn.Sequential(

                      Residual3DBlock(
                          32,
                          32,
                      ),

                      Residual3DBlock(
                          32,
                          64,
                          stride=2,
                      ),

                      Residual3DBlock(
                          64,
                          128,
                          stride=2,
                      ),

                      Residual3DBlock(
                          128,
                          256,
                          stride=2,
                      ),
                  )

                  self.pool = nn.AdaptiveAvgPool3d(
                      1
                  )

                  self.fc = nn.Linear(
                      256,
                      num_classes,
                  )


              def forward(self, x):
                  x = self.stem(x)

                  x = self.layers(x)

                  x = self.pool(x)

                  x = torch.flatten(
                      x,
                      1,
                  )

                  return self.fc(x)


          def create_model(
              model_name,
              num_classes=3,
          ):
              name = model_name.lower()

              if name in {
                  "mobibrainnet",
                  "mobi",
              }:
                  return MobiBrainNet3D(
                      num_classes
                  )

              if name in {
                  "cnn3d",
                  "3dcnn",
                  "cnn",
              }:
                  return BaselineCNN3D(
                      num_classes
                  )

              if name in {
                  "resnet3d",
                  "resnet",
              }:
                  return ResNet3D(
                      num_classes
                  )

              raise ValueError(
                  f"Unknown model: {model_name}"
              )


          def parameter_count(model):
              return sum(
                  parameter.numel()
                  for parameter in model.parameters()
                  if parameter.requires_grad
              )
          PYEOF

          # =========================================================
          # src/utils.py
          # =========================================================

          cat > src/utils.py <<'PYEOF'
          import json
          import random
          from pathlib import Path

          import numpy as np
          import torch


          def set_seed(seed=42):
              random.seed(seed)

              np.random.seed(seed)

              torch.manual_seed(seed)

              if torch.cuda.is_available():
                  torch.cuda.manual_seed_all(
                      seed
                  )


          def get_device():
              return torch.device(
                  "cuda"
                  if torch.cuda.is_available()
                  else "cpu"
              )


          def save_json(
              data,
              path,
          ):
              path = Path(path)

              path.parent.mkdir(
                  parents=True,
                  exist_ok=True,
              )

              with open(
                  path,
                  "w",
                  encoding="utf-8",
              ) as file:
                  json.dump(
                      data,
                      file,
                      indent=2,
                  )
          PYEOF

          # =========================================================
          # src/train.py
          # =========================================================

          cat > src/train.py <<'PYEOF'
          import argparse
          from pathlib import Path

          import torch
          import torch.nn as nn

          from sklearn.model_selection import train_test_split
          from torch.utils.data import DataLoader

          from .config import (
              BATCH_SIZE,
              CLASS_NAMES,
              LEARNING_RATE,
              MODEL_DIR,
              RANDOM_SEED,
              VOLUME_SIZE,
              WEIGHT_DECAY,
          )

          from .data import (
              MRIVolumeDataset,
              discover_dataset,
          )

          from .models import (
              create_model,
              parameter_count,
          )

          from .utils import (
              get_device,
              save_json,
              set_seed,
          )


          def parse_args():

              parser = argparse.ArgumentParser(
                  description=(
                      "Train 3D Alzheimer's "
                      "classification model"
                  )
              )

              parser.add_argument(
                  "--data",
                  default="dataset",
              )

              parser.add_argument(
                  "--model",
                  default="mobibrainnet",
                  choices=[
                      "mobibrainnet",
                      "cnn3d",
                      "resnet3d",
                  ],
              )

              parser.add_argument(
                  "--epochs",
                  type=int,
                  default=30,
              )

              parser.add_argument(
                  "--batch-size",
                  type=int,
                  default=BATCH_SIZE,
              )

              parser.add_argument(
                  "--lr",
                  type=float,
                  default=LEARNING_RATE,
              )

              return parser.parse_args()


          def accuracy(
              logits,
              labels,
          ):
              predictions = logits.argmax(
                  dim=1
              )

              return (
                  predictions == labels
              ).float().mean().item()


          def run_epoch(
              model,
              loader,
              criterion,
              device,
              optimizer=None,
          ):
              training = optimizer is not None

              model.train(training)

              total_loss = 0.0

              total_correct = 0

              total_samples = 0

              for batch in loader:

                  images = batch["image"].to(
                      device
                  )

                  labels = batch["label"].to(
                      device
                  )

                  if training:
                      optimizer.zero_grad(
                          set_to_none=True
                      )

                  with torch.set_grad_enabled(
                      training
                  ):
                      logits = model(images)

                      loss = criterion(
                          logits,
                          labels,
                      )

                      if training:
                          loss.backward()

                          optimizer.step()

                  batch_size = labels.size(0)

                  total_loss += (
                      loss.item()
                      * batch_size
                  )

                  total_correct += (
                      logits.argmax(1)
                      == labels
                  ).sum().item()

                  total_samples += batch_size

              return {
                  "loss": (
                      total_loss
                      / max(
                          total_samples,
                          1,
                      )
                  ),
                  "accuracy": (
                      total_correct
                      / max(
                          total_samples,
                          1,
                      )
                  ),
              }


          def main():
              args = parse_args()

              set_seed(
                  RANDOM_SEED
              )

              device = get_device()

              samples = discover_dataset(
                  args.data,
                  CLASS_NAMES,
              )

              paths = [
                  item[0]
                  for item in samples
              ]

              labels = [
                  item[1]
                  for item in samples
              ]

              train_paths, val_paths, \
              train_labels, val_labels = \
                  train_test_split(
                      paths,
                      labels,
                      test_size=0.20,
                      random_state=RANDOM_SEED,
                      stratify=labels,
                  )

              train_samples = list(
                  zip(
                      train_paths,
                      train_labels,
                  )
              )

              val_samples = list(
                  zip(
                      val_paths,
                      val_labels,
                  )
              )

              train_dataset = MRIVolumeDataset(
                  train_samples,
                  VOLUME_SIZE,
                  augment=True,
              )

              val_dataset = MRIVolumeDataset(
                  val_samples,
                  VOLUME_SIZE,
                  augment=False,
              )

              train_loader = DataLoader(
                  train_dataset,
                  batch_size=args.batch_size,
                  shuffle=True,
                  num_workers=2,
                  pin_memory=True,
              )

              val_loader = DataLoader(
                  val_dataset,
                  batch_size=args.batch_size,
                  shuffle=False,
                  num_workers=2,
                  pin_memory=True,
              )

              model = create_model(
                  args.model,
                  num_classes=len(
                      CLASS_NAMES
                  ),
              ).to(device)

              print(
                  f"Device: {device}"
              )

              print(
                  "Trainable parameters:",
                  f"{parameter_count(model):,}",
              )

              criterion = nn.CrossEntropyLoss()

              optimizer = torch.optim.AdamW(
                  model.parameters(),
                  lr=args.lr,
                  weight_decay=WEIGHT_DECAY,
              )

              scheduler = (
                  torch.optim.lr_scheduler
                  .ReduceLROnPlateau(
                      optimizer,
                      mode="min",
                      factor=0.5,
                      patience=3,
                  )
              )

              MODEL_DIR.mkdir(
                  parents=True,
                  exist_ok=True,
              )

              checkpoint = (
                  MODEL_DIR
                  / f"{args.model}_best.pt"
              )

              history = []

              best_loss = float("inf")

              for epoch in range(
                  1,
                  args.epochs + 1,
              ):

                  train_metrics = run_epoch(
                      model,
                      train_loader,
                      criterion,
                      device,
                      optimizer,
                  )

                  val_metrics = run_epoch(
                      model,
                      val_loader,
                      criterion,
                      device,
                  )

                  scheduler.step(
                      val_metrics["loss"]
                  )

                  record = {
                      "epoch": epoch,
                      "train_loss": (
                          train_metrics["loss"]
                      ),
                      "train_accuracy": (
                          train_metrics[
                              "accuracy"
                          ]
                      ),
                      "val_loss": (
                          val_metrics["loss"]
                      ),
                      "val_accuracy": (
                          val_metrics[
                              "accuracy"
                          ]
                      ),
                  }

                  history.append(
                      record
                  )

                  print(
                      f"Epoch {epoch:03d} | "
                      f"train loss "
                      f"{record['train_loss']:.4f} | "
                      f"train acc "
                      f"{record['train_accuracy']:.4f} | "
                      f"val loss "
                      f"{record['val_loss']:.4f} | "
                      f"val acc "
                      f"{record['val_accuracy']:.4f}"
                  )

                  if (
                      val_metrics["loss"]
                      < best_loss
                  ):
                      best_loss = (
                          val_metrics["loss"]
                      )

                      torch.save(
                          {
                              "model_name": args.model,
                              "class_names": CLASS_NAMES,
                              "volume_size": VOLUME_SIZE,
                              "state_dict": (
                                  model.state_dict()
                              ),
                          },
                          checkpoint,
                      )

              save_json(
                  history,
                  "outputs/training_history.json",
              )

              print(
                  f"\nBest checkpoint: "
                  f"{checkpoint}"
              )


          if __name__ == "__main__":
              main()
          PYEOF

          # =========================================================
          # src/evaluate.py
          # =========================================================

          cat > src/evaluate.py <<'PYEOF'
          import argparse
          import json
          from pathlib import Path

          import matplotlib.pyplot as plt
          import numpy as np
          import torch

          from sklearn.metrics import (
              accuracy_score,
              classification_report,
              confusion_matrix,
              ConfusionMatrixDisplay,
              precision_recall_fscore_support,
              roc_auc_score,
              roc_curve,
          )

          from sklearn.model_selection import train_test_split

          from torch.utils.data import DataLoader

          from .config import (
              CLASS_NAMES,
              RANDOM_SEED,
          )

          from .data import (
              MRIVolumeDataset,
              discover_dataset,
          )

          from .models import create_model

          from .utils import get_device


          def parse_args():
              parser = argparse.ArgumentParser()

              parser.add_argument(
                  "--data",
                  default="dataset",
              )

              parser.add_argument(
                  "--checkpoint",
                  required=True,
              )

              return parser.parse_args()


          def main():
              args = parse_args()

              device = get_device()

              checkpoint = torch.load(
                  args.checkpoint,
                  map_location=device,
              )

              class_names = checkpoint.get(
                  "class_names",
                  CLASS_NAMES,
              )

              volume_size = tuple(
                  checkpoint.get(
                      "volume_size",
                      (96, 96, 96),
                  )
              )

              model = create_model(
                  checkpoint["model_name"],
                  len(class_names),
              )

              model.load_state_dict(
                  checkpoint["state_dict"]
              )

              model.to(device)

              model.eval()

              samples = discover_dataset(
                  args.data,
                  class_names,
              )

              paths = [
                  sample[0]
                  for sample in samples
              ]

              labels = [
                  sample[1]
                  for sample in samples
              ]

              _, val_paths, _, val_labels = (
                  train_test_split(
                      paths,
                      labels,
                      test_size=0.20,
                      random_state=RANDOM_SEED,
                      stratify=labels,
                  )
              )

              dataset = MRIVolumeDataset(
                  list(
                      zip(
                          val_paths,
                          val_labels,
                      )
                  ),
                  volume_size,
              )

              loader = DataLoader(
                  dataset,
                  batch_size=2,
                  shuffle=False,
              )

              targets = []

              predictions = []

              probabilities = []

              with torch.no_grad():

                  for batch in loader:

                      images = batch[
                          "image"
                      ].to(device)

                      labels_batch = batch[
                          "label"
                      ].to(device)

                      logits = model(images)

                      probs = torch.softmax(
                          logits,
                          dim=1,
                      )

                      preds = probs.argmax(
                          dim=1
                      )

                      targets.extend(
                          labels_batch.cpu().numpy()
                      )

                      predictions.extend(
                          preds.cpu().numpy()
                      )

                      probabilities.extend(
                          probs.cpu().numpy()
                      )

              targets = np.asarray(
                  targets
              )

              predictions = np.asarray(
                  predictions
              )

              probabilities = np.asarray(
                  probabilities
              )

              accuracy = accuracy_score(
                  targets,
                  predictions,
              )

              precision, recall, f1, _ = (
                  precision_recall_fscore_support(
                      targets,
                      predictions,
                      average="macro",
                      zero_division=0,
                  )
              )

              report = classification_report(
                  targets,
                  predictions,
                  target_names=class_names,
                  digits=4,
                  zero_division=0,
              )

              metrics = {
                  "accuracy": float(
                      accuracy
                  ),
                  "precision_macro": float(
                      precision
                  ),
                  "recall_macro": float(
                      recall
                  ),
                  "f1_macro": float(
                      f1
                  ),
              }

              try:
                  one_hot = np.eye(
                      len(class_names)
                  )[targets]

                  metrics["roc_auc_macro"] = (
                      float(
                          roc_auc_score(
                              one_hot,
                              probabilities,
                              multi_class="ovr",
                              average="macro",
                          )
                      )
                  )

              except ValueError:
                  pass

              output_dir = Path(
                  "outputs"
              )

              output_dir.mkdir(
                  parents=True,
                  exist_ok=True,
              )

              with open(
                  output_dir / "metrics.json",
                  "w",
                  encoding="utf-8",
              ) as file:
                  json.dump(
                      metrics,
                      file,
                      indent=2,
                  )

              with open(
                  output_dir
                  / "classification_report.txt",
                  "w",
                  encoding="utf-8",
              ) as file:
                  file.write(
                      report
                  )

              matrix = confusion_matrix(
                  targets,
                  predictions,
              )

              figure, axis = plt.subplots(
                  figsize=(7, 7)
              )

              display = ConfusionMatrixDisplay(
                  matrix,
                  display_labels=class_names,
              )

              display.plot(
                  ax=axis,
                  cmap="Blues",
                  colorbar=False,
              )

              figure.tight_layout()

              figure.savefig(
                  output_dir
                  / "confusion_matrix.png",
                  dpi=300,
                  bbox_inches="tight",
              )

              plt.close(
                  figure
              )

              one_hot = np.eye(
                  len(class_names)
              )[targets]

              figure = plt.figure(
                  figsize=(8, 6)
              )

              for index, class_name in enumerate(
                  class_names
              ):

                  try:
                      fpr, tpr, _ = roc_curve(
                          one_hot[:, index],
                          probabilities[:, index],
                      )

                      plt.plot(
                          fpr,
                          tpr,
                          label=class_name,
                      )

                  except ValueError:
                      continue

              plt.plot(
                  [0, 1],
                  [0, 1],
                  linestyle="--",
              )

              plt.xlabel(
                  "False Positive Rate"
              )

              plt.ylabel(
                  "True Positive Rate"
              )

              plt.title(
                  "One-vs-Rest ROC Curves"
              )

              plt.legend()

              plt.tight_layout()

              figure.savefig(
                  output_dir
                  / "roc_curves.png",
                  dpi=300,
                  bbox_inches="tight",
              )

              plt.close(
                  figure
              )

              print(
                  json.dumps(
                      metrics,
                      indent=2,
                  )
              )

              print()

              print(
                  report
              )


          if __name__ == "__main__":
              main()
          PYEOF

          # =========================================================
          # src/predict.py
          # =========================================================

          cat > src/predict.py <<'PYEOF'
          import argparse

          import torch

          from .data import (
              load_volume,
              normalize_volume,
              resize_volume,
          )

          from .models import create_model

          from .utils import get_device


          def parse_args():
              parser = argparse.ArgumentParser()

              parser.add_argument(
                  "--checkpoint",
                  required=True,
              )

              parser.add_argument(
                  "--volume",
                  required=True,
              )

              return parser.parse_args()


          def main():
              args = parse_args()

              device = get_device()

              checkpoint = torch.load(
                  args.checkpoint,
                  map_location=device,
              )

              class_names = checkpoint[
                  "class_names"
              ]

              volume_size = tuple(
                  checkpoint[
                      "volume_size"
                  ]
              )

              model = create_model(
                  checkpoint["model_name"],
                  len(class_names),
              )

              model.load_state_dict(
                  checkpoint["state_dict"]
              )

              model.to(device)

              model.eval()

              volume = load_volume(
                  args.volume
              )

              volume = normalize_volume(
                  volume
              )

              volume = resize_volume(
                  volume,
                  volume_size,
              )

              volume = volume.unsqueeze(
                  0
              ).to(device)

              with torch.no_grad():

                  logits = model(
                      volume
                  )

                  probabilities = torch.softmax(
                      logits,
                      dim=1,
                  )[0]

              index = int(
                  probabilities.argmax()
              )

              print(
                  "\nPrediction"
              )

              print(
                  "-" * 40
              )

              print(
                  f"Class      : "
                  f"{class_names[index]}"
              )

              print(
                  f"Confidence : "
                  f"{probabilities[index].item():.2%}"
              )

              print(
                  "\nProbabilities"
              )

              print(
                  "-" * 40
              )

              for name, probability in zip(
                  class_names,
                  probabilities,
              ):
                  print(
                      f"{name:<12}: "
                      f"{probability.item():.2%}"
                  )


          if __name__ == "__main__":
              main()
          PYEOF

